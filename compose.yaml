services:
  mongo:
    image: mongo:5.0
    restart: always
    ports:
      - 27017:27017
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DB_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_PW}
      GLIBC_TUNABLES: glibc.pthread.rseq=1
    volumes:
      - ./backup:/backup:Z
      - ./data:/data/db:Z

  vcs-shark:
    build: .
    command: sh -c 'vcsshark -D mongo -U ${DB_USER} -P ${DB_PW} -DB ${DB_NAME} -H ${DB_HOST} -p ${DB_PORT} --project-name $$PROJECT --path /repos/$$PROJECT -a admin --cores-per-job 1'
    environment:
      PROJECT: uploader
    volumes:
      - ./repos:/repos:z

  pr-shark:
    build: .
    command: sh -c 'python3 prSHARK/smartshark_plugin.py -D mongo -U ${DB_USER} -P ${DB_PW} -DB ${DB_NAME} -H ${DB_HOST} -p ${DB_PORT} --project-name $$PROJECT -i $$URL -b $$BACKEND -a admin --token ${GH_TOKEN}'
    environment:
      PROJECT: uploader
      BACKEND: github
      URL: https://github.com/tidepool-org/uploader/pulls
    volumes:
      - ./repos:/repos:z

  coverage-shark:
    build: .
    command: sh -c 'python3 coverageSHARK/smartshark_plugin.py -D mongo -U ${DB_USER} -P ${DB_PW} -DB ${DB_NAME} -H ${DB_HOST} -p ${DB_PORT} --project-name $$PROJECT -a admin'
    environment:
      PROJECT: uploader
    volumes:
      - ./coverage/uploader:/coverage:z

  refactoring-shark:
    build: .
    command: >
      sh -c 'echo "=== refactoringSHARK: project=$$PROJECT revision_limit=$$REVISION_LIMIT timeout=$${TIMEOUT}s ===";
      for rev in $$(git -C /repos/$$PROJECT rev-list --all --max-count=$$REVISION_LIMIT); do
      echo "=== analyzing $$rev ===";
      python3 /refactoringSHARK/smartshark_plugin.py
      --path /repos/$$PROJECT
      --revision $$rev
      --url $$(git -C /repos/$$PROJECT config --get remote.origin.url)
      --project-name $$PROJECT
      --db-hostname ${DB_HOST} --db-port ${DB_PORT} --db-database ${DB_NAME}
      --db-user ${DB_USER} --db-password ${DB_PW} --db-authentication admin
      --timeout $$TIMEOUT
      --skip-timeouts --skipped-log $$SKIPPED_LOG
      --log-level INFO || exit 1; done;
      echo "=== skipped commits ===";
      if [ -f $$SKIPPED_LOG ]; then wc -l < $$SKIPPED_LOG; cat $$SKIPPED_LOG; else echo none; fi'
    environment:
      PROJECT: uploader
      # number of most recent commits to analyse; raise for a full run
      REVISION_LIMIT: 100
      # per commit timeout in seconds for RefactoringMiner
      TIMEOUT: 120
      SKIPPED_LOG: /tmp/refactoringSHARK_skipped.txt
    volumes:
      - ./repos:/repos:z
